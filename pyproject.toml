[project]
name = "ol-english-paper-marker"
version = "0.1.0"
description = "Local-first foundation for an auditable O/L English marking system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=app",
    "--cov=scripts",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["app", "scripts", "tests"]
